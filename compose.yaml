name: ac-metrics

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ac_metrics}
      POSTGRES_USER: ${POSTGRES_USER:-ac_metrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${AC_POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      AC_DATABASE_URL: ${AC_DATABASE_URL:?set AC_DATABASE_URL in .env}
      AC_EDGE_API_TOKEN: ${AC_EDGE_API_TOKEN:?set AC_EDGE_API_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      AC_DATABASE_URL: ${AC_DATABASE_URL:?set AC_DATABASE_URL in .env}
      AC_EDGE_API_TOKEN: ${AC_EDGE_API_TOKEN:?set AC_EDGE_API_TOKEN in .env}
      AC_LOG_LEVEL: ${AC_LOG_LEVEL:-INFO}
      AC_PI_API_URL: ${AC_PI_API_URL:-}
      AC_PI_API_TOKEN: ${AC_PI_API_TOKEN:-}
      AC_PI_SYNC_TIMEOUT_SECONDS: ${AC_PI_SYNC_TIMEOUT_SECONDS:-120}
      AC_PI_STATUS_TIMEOUT_SECONDS: ${AC_PI_STATUS_TIMEOUT_SECONDS:-8}
      AC_PI_STATUS_INTERVAL_SECONDS: ${AC_PI_STATUS_INTERVAL_SECONDS:-3600}
      AC_TELEMETRY_STALE_SECONDS: ${AC_TELEMETRY_STALE_SECONDS:-900}
      AC_DASHBOARD_USERNAME: ${AC_DASHBOARD_USERNAME:-admin}
      AC_DASHBOARD_PASSWORD_HASH: ${AC_DASHBOARD_PASSWORD_HASH:?run scripts/configure_dashboard_auth.py}
      AC_DASHBOARD_SESSION_SECRET: ${AC_DASHBOARD_SESSION_SECRET:?run scripts/configure_dashboard_auth.py}
      AC_DASHBOARD_SESSION_TTL_SECONDS: ${AC_DASHBOARD_SESSION_TTL_SECONDS:-604800}
      AC_DASHBOARD_COOKIE_SECURE: ${AC_DASHBOARD_COOKIE_SECURE:-false}
    ports:
      - "${AC_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  test-db:
    image: postgres:16-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: ac_metrics_test
      POSTGRES_USER: ac_metrics_test
      POSTGRES_PASSWORD: ac_metrics_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ac_metrics_test -d ac_metrics_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-migrate:
    build: .
    profiles: ["test"]
    command: ["alembic", "upgrade", "head"]
    environment:
      AC_DATABASE_URL: postgresql+psycopg://ac_metrics_test:ac_metrics_test_password@test-db:5432/ac_metrics_test
      AC_EDGE_API_TOKEN: test-edge-token-that-is-at-least-32-characters
      AC_DASHBOARD_PASSWORD_HASH: pbkdf2_sha256:600000:MDEyMzQ1Njc4OWFiY2RlZg:wb2l8JuhJjo7GeppjEHJHGWc-q6HhJMJY1Jfn0ZdfuE
      AC_DASHBOARD_SESSION_SECRET: test-dashboard-session-secret-at-least-32-characters
    depends_on:
      test-db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_metrics_test:ac_metrics_test_password@test-db:5432/ac_metrics_test
      AC_EDGE_API_TOKEN: test-edge-token-that-is-at-least-32-characters
    depends_on:
      test-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
