[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-metrics"
version = "0.4.0"
description = "Self-contained Bosch IDS telemetry ingestion and visualization"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
]

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["server/tests"]
cache_dir = "/tmp/ac-metrics-pytest-cache"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["server/app"]
